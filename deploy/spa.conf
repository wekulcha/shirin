server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    location = /shirin { return 308 /shirin/; }
    location = /shirin/api { default_type application/json; return 404 '{"detail":"Not Found"}'; }
    location ^~ /shirin/api/ { default_type application/json; return 404 '{"detail":"Not Found"}'; }
    location ^~ /shirin/webhooks/ { default_type application/json; return 404 '{"detail":"Not Found"}'; }
    location ^~ /shirin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /shirin/ {
        try_files $uri $uri/ /shirin/index.html;
        add_header Cache-Control "no-cache";
    }
    location / { return 404; }
}
